name: agraz
description: "A New Ray of Hope in Agriculture."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+15

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^1.1.0 
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  intl_phone_field: ^3.2.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  youtube_player_flutter: ^9.1.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# ADD THIS SECTION TO FIX THE DEPENDENCY CONFLICT
dependency_overrides:
  vector_math: ^2.2.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo_padded.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo_padded.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/app_logo.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: scaleAspectFit
  fullscreen: true
  android_12:
    color: "#FFFFFF"
    image: assets/images/app_logo_padded.png
    icon_background_color: "#FFFFFF"

